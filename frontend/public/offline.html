<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — FinanceFlow</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #0b0e11;
        color: #eaecef;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .dot {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(252, 213, 53, 0.15);
        color: #fcd535;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        font-size: 22px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: #848e9c;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">⚡</div>
      <h1>You're offline</h1>
      <p>
        No internet connection right now. Any expenses or income you add will be saved on this
        device and synced automatically once you're back online.
      </p>
    </div>
  </body>
</html>
